# Deployment example only. This file is not read by ADR Campus or the definition tool.
# The executable definition is DecisionsDefinition.Current. Its generated YAML describes
# package requirements; it does not provision infrastructure or supply authentication.
# Actual identity is bound through AddDecisionsOffice; the factory resolves ILibrary and
# IWorkbench from the owning Institution and fails if either is absent.
# Provider configuration remains the deployment host's responsibility.

institution: decisions
version: 1.0.0

deployment:
  name: forge-decisions

bindings:
  ILibrary:
    source: owner.library
  IWorkbench:
    source: owner.workbench

# Existing provider lookup names are preserved, with no data migration.
# The Workbench stage is adr-campus-workbench; the knowledge scheme is adr-campus.
# Archive, Post Office and Registry remain host-composed for other application journeys.
